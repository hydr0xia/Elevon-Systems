    <meta property="og:title" content="Elevon" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ['"Syne"', 'sans-serif'],
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              elevon: {
                bg: '#d9d9d9',
                card: '#e5e5e5',
                darkCard: '#0f0f12',
                border: '#bfbfbf',
                blue: '#2e4af0',
                blueDark: '#1d34b8',
                blueLight: '#4d67ff',
                black: '#0a0a0a',
                slate: '#262626',
              }
            }
          }
        }
      }
    </script>
    <style>
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 80px;
      }
      body {
        background-color: #d9d9d9;
        color: #0a0a0a;
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      /* Custom scrollbar matching Elevon palette */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #d9d9d9;
      }
      ::-webkit-scrollbar-thumb {
        background: #2e4af0;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #1d34b8;
      }
    </style>
