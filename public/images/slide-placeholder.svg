<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none">
  <!-- Background in Elevon main color #d9d9d9 -->
  <rect width="1600" height="900" fill="#D9D9D9"/>
  
  <!-- Technical Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#C0C0C0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- Center Card -->
  <rect x="300" y="200" width="1000" height="500" rx="16" fill="#E5E5E5" stroke="#0A0A0A" stroke-width="3"/>

  <!-- Elevon Accent Winglet -->
  <g transform="translate(730, 290)">
    <polygon points="10,80 46,14 74,14 38,80" fill="#0A0A0A"/>
    <polygon points="50,80 86,14 110,14 74,80" fill="#2E4AF0"/>
  </g>

  <!-- Placeholder Text -->
  <text x="800" y="440" font-family="sans-serif" font-size="28" font-weight="800" text-anchor="middle" fill="#0A0A0A" letter-spacing="4">
    ELEVON PITCH DECK ASSET
  </text>
  <text x="800" y="480" font-family="monospace" font-size="18" text-anchor="middle" fill="#2E4AF0" font-weight="600">
    #d9d9d9 &bull; #2e4af0 &bull; black
  </text>
  <text x="800" y="530" font-family="monospace" font-size="15" text-anchor="middle" fill="#666666">
    Drop or upload your slide image in the app or copy to /public/images/
  </text>

  <!-- Corner Reticles -->
  <path d="M 320 230 L 320 220 L 330 220" stroke="#0A0A0A" stroke-width="3" fill="none"/>
  <path d="M 1280 230 L 1280 220 L 1270 220" stroke="#0A0A0A" stroke-width="3" fill="none"/>
  <path d="M 320 670 L 320 680 L 330 680" stroke="#0A0A0A" stroke-width="3" fill="none"/>
  <path d="M 1280 670 L 1280 680 L 1270 680" stroke="#0A0A0A" stroke-width="3" fill="none"/>
</svg>
